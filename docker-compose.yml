# FluxGate: 3 stateless app instances behind Nginx, sharing one Redis.
#
#   client ──► nginx :8080 ──round-robin──► app1 ┐
#                                          app2 ├──► redis (one global limit)
#                                          app3 ┘
#
# Switch the limiter store without editing this file:
#   STORE=memory docker compose up -d      (each instance counts alone: 3x the limit)
#   STORE=redis-naive docker compose up -d (shared but racy)
#   docker compose up -d                   (default: redis-lua, shared and atomic)
#
# With dashboards (Grafana on http://localhost:3001, Prometheus on :9090):
#   docker compose --profile observability up -d

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &app-env
    STORE: ${STORE:-redis-lua}
    FAIL_MODE: ${FAIL_MODE:-open}
    REDIS_URL: redis://redis:6379
    TRUST_PROXY: "1"
    LEASE_SIZE: ${LEASE_SIZE:-5}
    # Protects POST /v1/check. Empty means open (a warning is logged): set it outside local demos.
    SERVICE_TOKEN: ${SERVICE_TOKEN:-}
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    # No persistence: limiter state is short-lived by design (keys expire when
    # the bucket refills), so losing it on restart just gives everyone a fresh bucket.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
      - app3

  # Observability, only on demand: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app1
      - app2
      - app3

  grafana:
    image: grafana/grafana:13.1.1
    profiles: ["observability"]
    environment:
      # Read-only access without logging in, straight to the FluxGate dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fluxgate.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Load test, only on demand:  docker compose --profile bench run --rm k6
  k6:
    image: grafana/k6:0.54.0
    profiles: ["bench"]
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      TARGET: http://nginx
      RUN_LABEL: ${STORE:-redis-lua}
    command: ["run", "/scripts/global-limit.js"]
    depends_on:
      - nginx
