# Nginx as a plain round-robin load balancer. It knows nothing about rate
# limiting; the instances behind it are stateless and share Redis, which
# is exactly why the limit stays global no matter which instance a request hits.

worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;

  upstream fluxgate {
    # Round-robin is nginx's default strategy: app1, app2, app3, app1, ...
    server app1:3000;
    server app2:3000;
    server app3:3000;
    keepalive 64;  # reuse connections to the apps instead of opening one per request
  }

  server {
    listen 80;

    # Metrics are for Prometheus on the internal network, not for the internet.
    location = /metrics {
      deny all;
    }

    location / {
      proxy_pass http://fluxgate;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Appends the real client IP. The apps run with `trust proxy = 1`, so they
      # read the right-most entry (the one nginx added), which clients can't forge.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
